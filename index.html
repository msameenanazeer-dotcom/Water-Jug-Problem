<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Water Jug Problem</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff6ff, #8ed8ff);
            min-height: 100vh;
            color: #17324d;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #075985;
        }

        .problem {
            background: #e0f2fe;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            line-height: 1.6;
        }

        .goal {
            color: #dc2626;
            font-weight: bold;
        }

        /* JUGS */

        .jugs {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin: 40px 0;
        }

        .jug-box {
            text-align: center;
        }

        .jug-box h2 {
            color: #075985;
        }

        .jug {
            width: 150px;
            height: 280px;
            border: 6px solid #075985;
            border-top: 0;
            border-radius: 0 0 25px 25px;
            position: relative;
            overflow: hidden;
            background: #f0f9ff;
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(
                to top,
                #0284c7,
                #38bdf8
            );
            transition: height 1s ease;
        }

        .water::before {
            content: "";
            position: absolute;
            top: 0;
            width: 100%;
            height: 7px;
            background: rgba(255,255,255,0.5);
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            color: #0369a1;
        }

        /* BUTTONS */

        .buttons {
            text-align: center;
            margin: 20px;
        }

        button {
            border: none;
            padding: 13px 22px;
            margin: 6px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .solve {
            background: #16a34a;
        }

        .next {
            background: #ea580c;
        }

        .reset {
            background: #dc2626;
        }

        /* STATUS */

        .status {
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            margin: 20px;
            min-height: 30px;
        }

        /* STEPS */

        .steps {
            background: #f8fafc;
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
        }

        .steps h2 {
            text-align: center;
            color: #075985;
        }

        .step {
            background: white;
            padding: 12px;
            margin: 8px auto;
            border-radius: 8px;
            max-width: 700px;
            border-left: 5px solid #0284c7;
        }

        .active {
            background: #fef08a;
            border-left-color: #eab308;
            font-weight: bold;
        }

        .success {
            color: green;
            font-size: 24px;
        }

        @media (max-width: 700px) {

            .jugs {
                gap: 20px;
            }

            .jug {
                width: 120px;
                height: 230px;
            }
        }
    </style>

</head>


<body>

<div class="container">

    <h1>💧 Water Jug Problem</h1>


    <div class="problem">

        <p>
            We have two jugs:
            <b>4 Litres</b> and <b>3 Litres</b>.
        </p>

        <p>
            The objective is to get exactly
            <span class="goal">2 Litres</span>
            in one jug.
        </p>

        <p>
            The jugs have no measurement markings.
        </p>

    </div>


    <!-- JUGS -->

    <div class="jugs">

        <!-- 4 LITRE -->

        <div class="jug-box">

            <h2>🪣 4 Litre Jug</h2>

            <div class="jug">

                <div
                    id="water4"
                    class="water"
                    style="height:0%">
                </div>

            </div>

            <div class="amount">

                <span id="amount4">0</span> / 4 L

            </div>

        </div>


        <!-- 3 LITRE -->

        <div class="jug-box">

            <h2>🪣 3 Litre Jug</h2>

            <div class="jug">

                <div
                    id="water3"
                    class="water"
                    style="height:0%">
                </div>

            </div>

            <div class="amount">

                <span id="amount3">0</span> / 3 L

            </div>

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="solve"
            onclick="solve()">
            🧠 Solve Automatically
        </button>

        <button
            class="next"
            onclick="nextStep()">
            ▶ Next Step
        </button>

        <button
            class="reset"
            onclick="resetGame()">
            🔄 Reset
        </button>

    </div>


    <!-- STATUS -->

    <div
        id="status"
        class="status">

        Click "Solve Automatically" to start.

    </div>


    <!-- SOLUTION STEPS -->

    <div class="steps">

        <h2>📋 Solution Steps</h2>

        <div id="steps">

            <div class="step">
                Step 0: Start → (0, 0)
            </div>

        </div>

    </div>

</div>


<script>

    /*
    ==========================================
    GAME STATE
    ==========================================
    */

    let jug4 = 0;

    let jug3 = 0;

    let currentStep = 0;

    let timer = null;


    /*
    ==========================================
    SOLUTION
    ==========================================

    State format:

    (4L jug, 3L jug)

    Start:
    (0,0)

    Step 1:
    Fill 3L
    (0,3)

    Step 2:
    Pour 3L -> 4L
    (3,0)

    Step 3:
    Fill 3L
    (3,3)

    Step 4:
    Pour 3L -> 4L
    (4,2)

    Goal achieved!
    */

    const solution = [

        {
            action: "Start",
            a: 0,
            b: 0
        },

        {
            action: "Fill the 3L jug",
            a: 0,
            b: 3
        },

        {
            action: "Pour 3L → 4L",
            a: 3,
            b: 0
        },

        {
            action: "Fill the 3L jug",
            a: 3,
            b: 3
        },

        {
            action: "Pour 3L → 4L",
            a: 4,
            b: 2
        }

    ];


    /*
    ==========================================
    RENDER
    ==========================================
    */

    function render() {

        document.getElementById("amount4")
            .textContent = jug4;

        document.getElementById("amount3")
            .textContent = jug3;


        document.getElementById("water4")
            .style.height =
            (jug4 / 4 * 100) + "%";


        document.getElementById("water3")
            .style.height =
            (jug3 / 3 * 100) + "%";

    }


    /*
    ==========================================
    SHOW STEPS
    ==========================================
    */

    function showSteps() {

        const box =
            document.getElementById("steps");

        box.innerHTML = "";


        solution.forEach((step, index) => {

            const div =
                document.createElement("div");

            div.className = "step";

            div.id =
                "step" + index;


            if (index === currentStep) {

                div.classList.add("active");

            }


            div.innerHTML =

                "<b>Step " +
                index +
                ":</b> " +

                step.action +

                " → " +

                "(" +
                step.a +
                ", " +
                step.b +
                ")";


            box.appendChild(div);

        });

    }


    /*
    ==========================================
    GO TO NEXT STEP
    ==========================================
    */

    function nextStep() {

        if (currentStep >= solution.length - 1) {

            document.getElementById("status")
                .innerHTML =
                "🎉 <span class='success'>Solved! Exactly 2 Litres!</span>";

            return;
        }


        currentStep++;


        jug4 =
            solution[currentStep].a;

        jug3 =
            solution[currentStep].b;


        render();

        showSteps();


        document.getElementById("status")
            .textContent =
            solution[currentStep].action;


        /*
            Check goal
        */

        if (jug4 === 2 || jug3 === 2) {

            document.getElementById("status")
                .innerHTML =
                "🎉 <span class='success'>" +
                "SUCCESS! Exactly 2 Litres measured!" +
                "</span>";

        }

    }


    /*
    ==========================================
    AUTOMATIC SOLVER
    ==========================================
    */

    function solve() {

        resetGame();

        currentStep = 0;

        showSteps();


        /*
            Automatically perform
            each step every 1.5 seconds.
        */

        timer = setInterval(function() {

            if (
                currentStep <
                solution.length - 1
            ) {

                nextStep();

            } else {

                clearInterval(timer);

            }

        }, 1500);

    }


    /*
    ==========================================
    RESET
    ==========================================
    */

    function resetGame() {

        if (timer) {

            clearInterval(timer);

            timer = null;

        }


        jug4 = 0;

        jug3 = 0;

        currentStep = 0;


        document.getElementById("status")
            .textContent =
            'Click "Solve Automatically" to start.';


        render();

        showSteps();

    }


    /*
    ==========================================
    START
    ==========================================
    */

    render();

    showSteps();

</script>

</body>

</html>
